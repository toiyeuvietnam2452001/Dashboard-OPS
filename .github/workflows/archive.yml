name: Archive report snapshot

# Every time data.json changes (button in Excel, Power Automate, or a manual upload),
# keep a copy under history/<report_date>.json so old reports stay viewable on the dashboard.
on:
  push:
    branches: [main]
    paths: [data.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/archive.py
      - name: Commit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Archive report snapshot $(python3 -c 'import json;print(json.load(open("data.json"))["meta"][0]["report_date"])')"
          git pull --rebase origin main
          git push origin HEAD:main
